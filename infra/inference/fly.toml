# Fly.io deploy for the inference service (optional).
# From infra/inference:
#   fly launch --no-deploy --copy-config
#   fly volumes create ollama_models --size 20
#   fly secrets set INFERENCE_API_KEY=your-secret
#   fly deploy
#
# Use at least 8 GB RAM (qwen2.5:7b). Example: fly scale memory 8192

app = "tndrx-inference"
primary_region = "lhr"

[build]
  image = "ollama/ollama:latest"

[env]
  OLLAMA_HOST = "0.0.0.0:11434"

[mounts]
  source = "ollama_models"
  destination = "/root/.ollama"

[[services]]
  internal_port = 11434
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/api/tags"

[[vm]]
  memory = "8192mb"
  cpu_kind = "shared"
  cpus = 4
